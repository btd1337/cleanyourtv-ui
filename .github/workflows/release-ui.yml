# Builds the one CleanYourTV UI APK every TV takes (launcher-ui/build.sh with RELEASE=1: no TMDB key, city or language
# inside) and publishes it as a GitHub release. Each TV gets its settings afterwards from config.json or Settings.
#
# Run it by pushing a tag: git tag ui-v1.2.0 && git push origin ui-v1.2.0. versionCode comes from the tag
# (1.2.0 -> 10200), so every release can update the one before it.
#
# The APK is signed with one key forever, kept as four repository secrets (Settings > Secrets and variables > Actions):
#   UI_KEYSTORE_BASE64  base64 of the keystore file (base64 -i release.keystore | pbcopy)
#   UI_KEYSTORE_PASS    its password
#   UI_KEY_ALIAS        the key's alias
#   UI_KEY_PASS         the key's password (often the same as UI_KEYSTORE_PASS)
# Without them the workflow stops: a release signed with a throwaway key could never be updated.
name: Release CleanYourTV UI

on:
  push:
    tags: ["ui-v*"]

permissions:
  contents: write

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'matheus-caldeira/cleanyourtv-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG#ui-v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag $TAG is not ui-vMAJOR.MINOR.PATCH"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.UI_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.UI_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.UI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UI_KEY_PASS }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::UI_KEYSTORE_BASE64 and UI_KEYSTORE_PASS are not set (see the top of release-ui.yml)"; exit 1
          fi
          export KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          RELEASE=1 launcher-ui/build.sh
          rm -f "$KEYSTORE"
          out="CleanYourTV-UI-$VERSION_NAME.apk"
          mv launcher-ui/CleanYourTV-UI.apk "$out"
          sha256sum "$out" > "$out.sha256"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$out" | grep 'SHA-256' > signer.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          out="CleanYourTV-UI-$VERSION_NAME.apk"
          {
            echo "One APK for every TV: it carries no TMDB key, city or language. Install it, then give the TV its"
            echo "settings with a \`config.json\` (\`launcher-ui/config.sh\`) or in Settings on the TV."
            echo "See [launcher-ui/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/launcher-ui/README.md)."
            echo
            echo '```'
            cat "$out.sha256"
            cat signer.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" "$out" "$out.sha256" --title "CleanYourTV UI $VERSION_NAME" --notes-file notes.md
